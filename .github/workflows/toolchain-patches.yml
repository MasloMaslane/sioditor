name: toolchain-patches

# Cheap guard, separate from the multi-hour build: confirms the WASI patch series still
# applies to the pinned LLVM and that the compat layer still compiles and links. Patch
# rot is otherwise only discovered hours into a build.
on:
  push:
    paths:
      - 'toolchain/patches/**'
      - 'toolchain/wasi-compat/**'
      - 'toolchain/versions.env'
      - '.github/workflows/toolchain-patches.yml'
  pull_request:
    paths:
      - 'toolchain/**'
  workflow_dispatch:

jobs:
  patches-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the patch series applies to pinned LLVM
        run: ./toolchain/check-patches.sh /tmp/llvm

      - name: Fetch wasi-sdk
        run: |
          source toolchain/versions.env
          curl -sSL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          mkdir -p /opt/wasi-sdk && tar xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1

      - name: Compat layer compiles, links, and fixes the real call patterns
        run: ./toolchain/wasi-compat/verify.sh /opt/wasi-sdk
