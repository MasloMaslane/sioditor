name: toolchain-patches

# Cheap guard, separate from the multi-hour build: confirms the WASI patch series still
# applies to the pinned LLVM and that the compat layer still compiles and links. Patch
# rot is otherwise only discovered hours into a build.
on:
  push:
    paths:
      - 'toolchain/patches/**'
      - 'toolchain/wasi-compat/**'
      - 'toolchain/corpus/**'
      - 'packages/gnu-compat/**'
      - 'toolchain/versions.env'
      - '.github/workflows/toolchain-patches.yml'
  pull_request:
    paths:
      - 'toolchain/**'
  workflow_dispatch:

jobs:
  patches-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the patch series applies to pinned LLVM
        run: ./toolchain/check-patches.sh /tmp/llvm

      - name: Fetch wasi-sdk
        run: ./toolchain/fetch-wasi-sdk.sh /opt/wasi-sdk

      - name: Compat layer compiles, links, and fixes the real call patterns
        run: ./toolchain/wasi-compat/verify.sh /opt/wasi-sdk

      # Cross-checks the GNU compatibility shims against the standard library. Needs only
      # the wasi-sdk this job already has, so it costs a minute rather than a full build.
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: OI corpus
        env:
          WASI_SDK: /opt/wasi-sdk
        run: ./toolchain/corpus/run.sh
