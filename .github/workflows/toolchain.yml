name: toolchain

# Deliberate start only. This is a multi-hour build on a 4-vCPU runner, so it must never
# fire on an ordinary push that touches a script or a doc under toolchain/.
#
# Two ways in: the Run workflow button, or pushing a tag named toolchain-build-*, which
# leaves a record of exactly which commit was built. Both require a human or a token with
# actions:write and tag-push rights.
on:
  workflow_dispatch:
  push:
    tags:
      - 'toolchain-build-*'

jobs:
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./toolchain/fetch-llvm.sh
      - uses: hendrikmuhs/ccache-action@v1
        with: { key: llvm-host }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: ./toolchain/build-host-tools.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-tools
          path: toolchain/build/host/bin

  cross-build:
    needs: host-tools
    runs-on: ubuntu-latest
    # The job cap is 6 h and a cold MinSizeRel LLVM on 4 vCPU is estimated at 3.5-5 h.
    # If this starts timing out, move to a larger runner rather than trimming the build.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      # The runner has ~14 GB free, which is the binding constraint - not CPU.
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build brotli

      - run: ./toolchain/fetch-llvm.sh

      # Same script a laptop uses, so the two cannot drift and the platform is detected
      # rather than hardcoded.
      - name: Fetch wasi-sdk
        run: ./toolchain/fetch-wasi-sdk.sh /opt/wasi-sdk

      - uses: actions/download-artifact@v4
        with:
          name: host-tools
          path: toolchain/build/host/bin
      - run: chmod +x toolchain/build/host/bin/*

      - name: Cross-build clang + lld
        env:
          WASI_SDK: /opt/wasi-sdk
        run: ./toolchain/build-wasm.sh

      - name: Pack the sysroot
        run: |
          node toolchain/ci/pack-sysroot.mjs /opt/wasi-sdk/share/wasi-sysroot toolchain/out
          cp toolchain/build/wasm/bin/llvm.wasm toolchain/out/

      - name: Precompress
        # Compression happens here, once, not per request: brotli-11 on a 60 MB wasm is
        # not something a web server should ever be asked to do on the fly.
        run: |
          for f in toolchain/out/*.wasm toolchain/out/*.bin; do
            brotli -q 11 -f -k "$f"
          done
          ls -l toolchain/out

      - uses: actions/upload-artifact@v4
        with:
          name: cpp-toolchain
          path: toolchain/out
