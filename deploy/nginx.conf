# nginx equivalent of deploy/Caddyfile. See docs/hosting.md for what each rule is for.
#
# Requires the ngx_http_gzip_static_module / brotli static module for precompressed
# assets; if you lack the brotli module, `gzip_static on` still works and costs roughly
# 30% more bytes on the dominant asset.

types {
    application/wasm  wasm;
    application/zip   whl;
}

server {
    listen 443 ssl http2;
    server_name sioditor.example.org;
    root /srv/sioditor;

    # Cross-origin isolation: SharedArrayBuffer depends on it, and so therefore do
    # Pyodide's interrupt buffer and blocking stdin. `always` matters - without it these
    # are dropped on error responses.
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "no-referrer" always;

    brotli_static on;
    gzip_static on;

    # Version-stamped and content-hashed: safe to pin forever, and the stable URL is what
    # keeps Chrome's compiled-wasm code cache valid between visits.
    location ~ ^/(toolchain|pyodide|assets)/ {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;   # never fall through to index.html
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
